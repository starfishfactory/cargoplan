name: Build Landing Pages

on:
  push:
    branches: [master]
    paths:
      - 'index.html'
      - 'pages.conf'
      - 'build.sh'
      - 'content/**'
      - '.github/workflows/build-pages.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build pages
        run: bash build.sh

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --force about.html services.html ocean.html air.html customs.html hazmat.html inland.html project.html contact.html network.html sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-generate landing pages and sitemap"
            git push
          fi
